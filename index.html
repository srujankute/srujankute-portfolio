<!DOCTYPE html>
<html lang="en" class="bg-gray-950 text-gray-100 scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srujan Kute | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="flex flex-col min-h-screen pt-20">
    <div id="navbar-container"></div>

    <main class="flex-grow flex items-center justify-center px-6 py-24 bg-radial-gradient">
        <div class="max-w-4xl text-center space-y-6 z-10">
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight text-white">
                Hi, I'm <span id="hero-name" class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">...</span>
            </h1>
            <p id="hero-title" class="text-sm font-mono uppercase tracking-widest text-blue-400 font-bold bg-blue-950/30 inline-block px-4 py-1.5 rounded-full border border-blue-900/50"></p>
            <p id="hero-bio" class="text-lg md:text-xl text-gray-400 font-light max-w-2xl mx-auto leading-relaxed pt-4"></p>
            
            <div class="pt-8 flex flex-wrap justify-center gap-4">
                <a href="projects.html" class="px-8 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg hover:shadow-blue-500/20 transition duration-300">View Work</a>
                <a href="contact.html" class="px-8 py-3.5 bg-gray-900 hover:bg-gray-800 text-gray-200 font-bold rounded-xl transition border border-gray-700">Get In Touch</a>
                <a id="resume-btn" href="#" download class="px-8 py-3.5 bg-gray-900 hover:bg-gray-800 text-blue-400 font-bold rounded-xl transition border border-gray-700 flex items-center gap-2">Download CV</a>
            </div>
        </div>
    </main>

    <section class="max-w-7xl mx-auto px-6 py-16 w-full border-t border-gray-900">
        <h2 class="text-sm font-mono font-bold mb-10 text-center text-gray-500 tracking-widest uppercase">Technical Competencies</h2>
        <div id="dynamic-skills" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 text-center"></div>
    </section>

    <div id="footer-container" class="mt-auto"></div>
    <script src="assets/js/utils.js"></script>
</body>
</html>
